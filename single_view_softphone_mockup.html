<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Mockup of a single-window softphone: registration header, two call cards with hold and merge controls, dial pad, and audio device footer.</h2>
<div style="background: var(--surface-1); border-radius: 16px; padding: 1.5rem; display: flex; justify-content: center;">
  <div style="width: 380px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 0.5px solid var(--border);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: var(--fill-success); display: inline-block;"></span>
        <span style="font-size: 13px; font-weight: 500;">agent12@sip.example.com</span>
      </div>
      <span style="font-size: 12px; color: var(--text-secondary);">Registered</span>
    </div>

    <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">

      <div style="border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div>
            <p style="margin: 0; font-size: 14px; font-weight: 500;">Client — J. Alvarez</p>
            <p style="margin: 0; font-size: 12px; color: var(--text-secondary);">04:32 · <span style="background: var(--bg-warning); color: var(--text-warning); padding: 1px 8px; border-radius: 8px; font-size: 11px;">On hold</span></p>
          </div>
          <div style="display: flex; gap: 6px;">
            <button aria-label="Resume" style="width: 34px; height: 34px; padding: 0;"><i class="ti ti-player-play" style="font-size: 16px;" aria-hidden="true"></i></button>
            <button aria-label="Hang up" style="width: 34px; height: 34px; padding: 0; color: var(--text-danger);"><i class="ti ti-phone-off" style="font-size: 16px;" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>

      <div style="border: 2px solid var(--border-accent); border-radius: var(--radius); padding: 10px 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div>
            <p style="margin: 0; font-size: 14px; font-weight: 500;">Expert — Dr. Chen</p>
            <p style="margin: 0; font-size: 12px; color: var(--text-secondary);">00:41 · <span style="background: var(--bg-success); color: var(--text-success); padding: 1px 8px; border-radius: 8px; font-size: 11px;">Active</span></p>
          </div>
          <div style="display: flex; gap: 6px;">
            <button aria-label="Mute" style="width: 34px; height: 34px; padding: 0;"><i class="ti ti-microphone-off" style="font-size: 16px;" aria-hidden="true"></i></button>
            <button aria-label="Hold" style="width: 34px; height: 34px; padding: 0;"><i class="ti ti-player-pause" style="font-size: 16px;" aria-hidden="true"></i></button>
            <button aria-label="Hang up" style="width: 34px; height: 34px; padding: 0; color: var(--text-danger);"><i class="ti ti-phone-off" style="font-size: 16px;" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>

      <button style="width: 100%; font-size: 13px;"><i class="ti ti-users-group" style="font-size: 16px; vertical-align: -3px; margin-right: 6px;" aria-hidden="true"></i>Merge calls into conference</button>
    </div>

    <div style="padding: 4px 16px 14px; border-top: 0.5px solid var(--border);">
      <input type="text" placeholder="Number or SIP address" style="width: 100%; margin: 12px 0 10px; font-size: 14px;" />
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
        <button style="height: 40px; font-size: 15px;">1</button><button style="height: 40px; font-size: 15px;">2</button><button style="height: 40px; font-size: 15px;">3</button>
        <button style="height: 40px; font-size: 15px;">4</button><button style="height: 40px; font-size: 15px;">5</button><button style="height: 40px; font-size: 15px;">6</button>
        <button style="height: 40px; font-size: 15px;">7</button><button style="height: 40px; font-size: 15px;">8</button><button style="height: 40px; font-size: 15px;">9</button>
        <button style="height: 40px; font-size: 15px;">*</button><button style="height: 40px; font-size: 15px;">0</button><button style="height: 40px; font-size: 15px;">#</button>
      </div>
      <button style="width: 100%; margin-top: 10px; background: var(--fill-success); color: var(--on-success); border: none; height: 40px; font-size: 14px; font-weight: 500;"><i class="ti ti-phone" style="font-size: 17px; vertical-align: -3px; margin-right: 6px;" aria-hidden="true"></i>Call</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 0.5px solid var(--border); background: var(--surface-1);">
      <span style="font-size: 12px; color: var(--text-secondary);"><i class="ti ti-headphones" style="font-size: 15px; vertical-align: -3px; margin-right: 5px;" aria-hidden="true"></i>Jabra Evolve 65</span>
      <span style="font-size: 12px; color: var(--text-secondary);"><i class="ti ti-settings" style="font-size: 15px; vertical-align: -3px;" aria-hidden="true"></i></span>
    </div>

  </div>
</div>
